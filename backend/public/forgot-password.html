<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:3000; img-src 'self' data:; form-action 'self';">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Forgot Password — GeoRewards</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #B5D300; --primary-dark: #8FA800;
  --dark: #0F1A00; --text: #1a1a1a; --text2: #666;
  --bg: #FAFFF0; --white: #fff; --error: #D32F2F;
  --radius: 12px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
nav { background: rgba(250,255,240,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(181,211,0,0.2); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 20px; font-weight: 800; color: var(--dark); text-decoration: none; letter-spacing: -0.5px; }
.logo span { color: var(--primary-dark); }
nav a { color: var(--text2); text-decoration: none; font-size: 14px; }
nav a:hover { color: var(--primary-dark); }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
.auth-card { background: var(--white); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: 0 8px 40px rgba(0,0,0,0.10); border: 1px solid rgba(181,211,0,0.15); }
.auth-card h1 { font-size: 26px; font-weight: 800; color: var(--dark); margin-bottom: 6px; letter-spacing: -0.5px; }
.auth-card .subtitle { font-size: 15px; color: var(--text2); margin-bottom: 32px; line-height: 1.5; }
.form-group { margin-bottom: 20px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
input[type="email"] { width: 100%; padding: 12px 14px; border: 1.5px solid #d0d0d0; border-radius: var(--radius); font-size: 15px; background: #fafafa; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(181,211,0,0.18); background: var(--white); }
.btn-primary { width: 100%; padding: 14px; background: var(--primary); color: var(--dark); border: none; border-radius: var(--radius); font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
.btn-primary:hover { background: var(--primary-dark); color: var(--white); }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
.msg { display: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 18px; }
.msg.show { display: block; }
.msg.error { background: #fff5f5; border: 1px solid #ffcdd2; color: var(--error); }
.msg.success { background: #f1f8e9; border: 1px solid #c5e1a5; color: #2e7d32; }
.back-link { display: block; text-align: center; margin-top: 24px; font-size: 14px; color: var(--primary-dark); text-decoration: none; font-weight: 600; }
.back-link:hover { text-decoration: underline; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.2); border-top-color: var(--dark); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
footer { text-align: center; padding: 24px; font-size: 13px; color: var(--text2); border-top: 1px solid #eee; }
footer a { color: var(--text2); text-decoration: none; margin: 0 8px; }
footer a:hover { color: var(--primary-dark); }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Geo<span>Rewards</span></a>
  <a href="login.html">Sign in →</a>
</nav>
<main>
  <div class="auth-card">
    <h1>Forgot password?</h1>
    <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

    <div class="msg error" id="error-msg"></div>
    <div class="msg success" id="success-msg"></div>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required maxlength="254" inputmode="email" />
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Send reset link</button>
    </form>

    <a href="login.html" class="back-link">← Back to sign in</a>
  </div>
</main>
<footer>
  <a href="index.html">Home</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
  © 2026 GeoRewards
</footer>
<script>
(function () {
  'use strict';
  const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:3000/api'
    : location.origin + '/api';

  const form = document.getElementById('forgot-form');
  const emailEl = document.getElementById('email');
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  const okEl = document.getElementById('success-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('show');
    okEl.classList.remove('show');
    const email = emailEl.value.trim();
    if (!email) { errEl.textContent = 'Email is required.'; errEl.classList.add('show'); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Sending…';
    try {
      const res = await fetch(API + '/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Something went wrong.'; errEl.classList.add('show'); }
      else {
        form.style.display = 'none';
        okEl.textContent = data.message;
        okEl.classList.add('show');
      }
    } catch {
      errEl.textContent = 'Network error. Please try again.';
      errEl.classList.add('show');
    }
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  });
})();
</script>
</body>
</html>
