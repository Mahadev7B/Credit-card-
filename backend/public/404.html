<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found — GeoRewards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1B5E20, #0D47A1);
    color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  .box { max-width: 460px; }
  .code { font-size: 96px; font-weight: 800; line-height: 1; opacity: 0.9; }
  h1 { font-size: 24px; margin: 16px 0 10px; }
  p { font-size: 15px; opacity: 0.85; line-height: 1.6; margin-bottom: 28px; }
  a {
    display: inline-block; background: #fff; color: #1B5E20;
    padding: 12px 28px; border-radius: 10px;
    text-decoration: none; font-weight: 700; font-size: 15px;
    transition: transform 0.15s;
  }
  a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/">← Back to GeoRewards</a>
  </div>
</body>
</html>
