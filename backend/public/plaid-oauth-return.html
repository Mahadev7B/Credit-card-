<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.plaid.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://cdn.plaid.com https://production.plaid.com https://sandbox.plaid.com;">
<title>Connecting your bank — GeoRewards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0F1A00; color: #fff;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  .logo { font-size: 22px; font-weight: 800; margin-bottom: 28px; }
  .logo span { color: #B5D300; }
  .spinner {
    display: inline-block; width: 48px; height: 48px;
    border: 4px solid rgba(181,211,0,0.25);
    border-top-color: #B5D300;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  p { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; }
  .error { color: #ff8a8a; margin-top: 16px; font-size: 14px; }
</style>
</head>
<body>
<div>
  <div class="logo">Geo<span>Rewards</span></div>
  <div class="spinner" id="spinner"></div>
  <h1 id="status-title">Completing bank connection…</h1>
  <p id="status-msg">Please wait while we securely finish connecting your account.</p>
  <p class="error" id="error-msg" style="display:none"></p>
</div>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
(function () {
  'use strict';

  const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:3000/api'
    : location.origin + '/api';

  function token() {
    return sessionStorage.getItem('sc_token') || localStorage.getItem('sc_token');
  }

  function showError(msg) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('status-title').textContent = 'Connection failed';
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-msg').style.display = '';
    setTimeout(() => { location.href = 'dashboard.html'; }, 4000);
  }

  async function init() {
    if (!token()) { location.href = 'login.html'; return; }

    // The link token must be stored before the redirect and retrieved here
    const linkToken = sessionStorage.getItem('plaid_link_token');
    if (!linkToken) {
      showError('Session expired. Please try again.');
      return;
    }

    const handler = Plaid.create({
      token: linkToken,
      receivedRedirectUri: window.location.href,
      onSuccess: async (publicToken) => {
        try {
          document.getElementById('status-msg').textContent = 'Saving your account…';
          const res = await fetch(API + '/plaid/exchange', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token(),
              'X-Requested-With': 'XMLHttpRequest',
            },
            body: JSON.stringify({ publicToken }),
          });
          if (!res.ok) throw new Error('Exchange failed');
          sessionStorage.removeItem('plaid_link_token');
          document.getElementById('status-title').textContent = 'Bank connected!';
          document.getElementById('status-msg').textContent = 'Redirecting to your dashboard…';
          setTimeout(() => { location.href = 'dashboard.html?plaid=success'; }, 1200);
        } catch (err) {
          showError('Could not save your bank connection. Please try again.');
        }
      },
      onExit: (err) => {
        if (err) showError(err.display_message || 'Bank connection cancelled.');
        else location.href = 'dashboard.html';
      },
    });

    handler.open();
  }

  init();
})();
</script>
</body>
</html>
